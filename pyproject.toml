[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-provision-api"
version = "0.1.0"
description = "Minimal FastAPI scaffold for data provision services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "azure-storage-blob>=12.23",
  "fastapi>=0.115",
  "fal-client>=0.7",
  "httpx>=0.27",
  "boto3>=1.35",
  "pydub>=0.25",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "qdrant-client>=1.11",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = ["data-provision-api[test]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
